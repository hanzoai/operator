# Fast-forward this repo's main from github.com/hanzoai/operator.
#
# WHY THIS EXISTS NOW. Until today git.hanzo.ai/hanzoai/operator was a PULL
# MIRROR, and it had been frozen since 2026-07-29 — Hanzo Git fetches mirrors
# anonymously, this repo is private on github.com, so every sync answered
# `remote: Repository not found` while `mirror_updated` kept bumping and the
# metadata went on looking healthy. A frozen mirror receives no pushes, fires no
# workflows, and reports `total_count: 0` runs, which is indistinguishable from
# nobody having pushed. That is why this repo's build lane had never run once.
# (It is not special: 393 repos on Hanzo Git are failing the same way.)
#
# The mirror is now converted to a regular repo, so Hanzo Git accepts pushes and
# runs Actions. That fixes the build lane and removes the automatic sync in the
# same stroke — so without this file a push to github.com would reach Hanzo Git
# never, build nothing, and look exactly like the failure we just cleared. The
# sync has to become explicit because it is no longer implicit.
#
# FAST-FORWARD ONLY, and it refuses rather than reconciles. A force from here
# would silently discard whatever is on Hanzo Git, and Hanzo Git is what CI and
# the registry now build from. Divergence is a human decision, so this errors and
# says so instead of picking a winner.
#
# The final dispatch is not belt-and-braces: a push made with a token triggers no
# workflows, so without it a synced commit would sit on main having built
# nothing — the same invisible-nothing-happened this file exists to prevent.
name: Sync from GitHub
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: sync-from-github
  cancel-in-progress: false
jobs:
  ff-main:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward main from github.com/hanzoai/operator
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git fetch --quiet "https://x-access-token:${GH_PAT}@github.com/hanzoai/operator.git" main
          LOCAL="$(git rev-parse HEAD)"; REMOTE="$(git rev-parse FETCH_HEAD)"
          if [ "$LOCAL" = "$REMOTE" ]; then echo "in sync at $LOCAL"; exit 0; fi
          if git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            echo "fast-forwarding $LOCAL -> $REMOTE"
            git push origin "$REMOTE:refs/heads/main"
            curl -fsS --max-time 20 -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${{ github.server_url }}/v1/repos/${{ github.repository }}/actions/workflows/cicd.yml/dispatches" \
              -d '{"ref":"main"}' \
              && echo "CI/CD dispatched" || echo "CI/CD dispatch failed (non-fatal — next direct push builds)"
          elif git merge-base --is-ancestor "$REMOTE" "$LOCAL"; then
            echo "canonical is AHEAD of GitHub — nothing to pull (never force from here)."
          else
            echo "::error::main DIVERGED between GitHub ($REMOTE) and canonical ($LOCAL) — refusing to force. Reconcile manually."
            exit 1
          fi
