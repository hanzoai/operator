name: CI/CD
# The ONE pipeline for the operator, on our own runners against git.hanzo.ai.
#
# Seven lines of caller; every real detail lives in the repo-root hanzo.yml,
# which platform.hanzo.ai reads too. That split is the point: hanzo.yml says
# WHAT to build and test, hanzoai/ci owns HOW, and neither is copied per repo.
#
# It replaces .github/workflows/publish.yml, which imported the deprecated
# hanzoai/.github reusable and had been failing to START on every push — GitHub
# reported "this run likely failed because of a workflow file issue", so no
# image was produced and merged fixes never reached the cluster while main
# looked healthy.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The GitHub->forge sync pushes with a token, and a token push triggers no
  # workflow — without this the mirrored commits would gate nothing.
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
