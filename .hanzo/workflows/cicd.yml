name: CI/CD
# The ONE pipeline for the operator, on our own runners against git.hanzo.ai.
#
# Seven lines of caller; every real detail lives in the repo-root hanzo.yml,
# which platform.hanzo.ai reads too. That split is the point: hanzo.yml says
# WHAT to build and test, hanzoai/ci owns HOW, and neither is copied per repo.
#
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The GitHub->Hanzo Git sync pushes with a token, and a token push triggers no
  # workflow — without this the mirrored commits would gate nothing.
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
