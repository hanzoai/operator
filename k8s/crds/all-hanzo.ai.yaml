apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imageupdates.hanzo.ai
spec:
  group: hanzo.ai
  names:
    categories: []
    kind: ImageUpdate
    plural: imageupdates
    shortNames:
    - imgup
    singular: imageupdate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.imageRepository
      name: Image
      type: string
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .status.latestTag
      name: Latest
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ImageUpdateSpec via `CustomResource`
        properties:
          spec:
            description: |-
              ImageUpdate — registry→git image automation. Replaces the `notify-universe`
              GitHub `repository_dispatch` + universe's `image-update.yml`: the operator
              watches `imageRepository` for tags matching `policy` (semver range / regex),
              and when a newer one appears it writes the bump back to `writeback` git (the
              deploy path), which the cloud deploy engine then rolls out. The whole loop —
              build→push→bump→apply — is closed in-cluster with no CI callback.
            properties:
              credentialsSecret:
                description: K8s Secret (key `token`) with git write access, KMS-synced.
                type: string
              imageRepository:
                description: |-
                  Registry repository to watch, e.g. `oci.hanzo.ai/hanzo/cloud`
                  (canonical fleet registry) — NOT ghcr.io, which is only for published OSS.
                type: string
              intervalSeconds:
                default: 300
                description: Poll interval in seconds. Default 300.
                format: uint64
                minimum: 0.0
                type: integer
              policy:
                default: semver:*
                description: |-
                  Tag-selection policy: a semver range (`>=1.0.0 <2.0.0`), `semver:*` for
                  newest semver, or `regex:<pattern>` for a named scheme. Amd64 arch suffix
                  (`-amd64`) is honored so it never selects an unpushed variant.
                type: string
              registrySecret:
                description: K8s Secret (docker config) for authenticated registry reads. Empty = anon.
                type: string
              writebackPath:
                description: |-
                  File in the writeback repo whose image tag is rewritten (the operator CR),
                  e.g. `infra/k8s/operator/crs/cloud.yaml`.
                type: string
              writebackRef:
                default: main
                type: string
              writebackRepo:
                description: The git repo to write the bump into (usually the same universe repo).
                type: string
            required:
            - imageRepository
            - writebackPath
            - writebackRepo
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastPushTime:
                nullable: true
                type: string
              lastPushedTag:
                description: Tag last written back to git (so a re-poll is idempotent).
                type: string
              latestTag:
                description: Newest tag the policy selected on the last poll.
                type: string
              message:
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Creating
                - Running
                - Degraded
                - Deleting
                - null
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ImageUpdate
        type: object
    served: true
    storage: true
    subresources:
      status: {}
