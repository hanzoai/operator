apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: s3s.hanzo.ai
spec:
  group: hanzo.ai
  names:
    categories: []
    kind: S3
    plural: s3s
    shortNames:
    - s3
    singular: s3
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for S3Spec via `CustomResource`
        properties:
          spec:
            description: |-
              The shared datastore workload VALUE: everything the StatefulSet + Service +
              PVC machinery needs, independent of engine. The engine is expressed by the
              Kind (`SQL`/`KV`/`DocDB`/`S3`/`Datastore`) or, for `ManagedDatabase`, by an
              explicit `engine` field — never braided into this value as a discriminator.
            properties:
              args:
                items:
                  type: string
                type: array
              backup:
                nullable: true
                properties:
                  enabled:
                    default: false
                    type: boolean
                  retentionDays:
                    format: int32
                    nullable: true
                    type: integer
                  s3Bucket:
                    type: string
                  s3CredentialsSecret:
                    type: string
                  s3Endpoint:
                    type: string
                  schedule:
                    type: string
                type: object
              command:
                items:
                  type: string
                type: array
              containerSecurityContext:
                description: |-
                  Container-level `securityContext` for the MAIN engine container —
                  `readOnlyRootFilesystem`, `allowPrivilegeEscalation`,
                  `capabilities{drop,add}`, `runAsNonRoot`, `runAsUser` — rendered onto the
                  engine container's `securityContext` ONLY (never the replication sidecar,
                  which must keep a writable rootfs to stream the WAL). Opt-in — an omitting
                  datastore renders a byte-identical container. Symmetric with the Service
                  path (`ServiceSpec.containerSecurityContext`).
                nullable: true
                properties:
                  allowPrivilegeEscalation:
                    nullable: true
                    type: boolean
                  capabilities:
                    description: |-
                      Linux `capabilities` to add/drop on a container (mirror of k8s
                      `Capabilities`). The fleet baseline is `drop: [ALL]`.
                    nullable: true
                    properties:
                      add:
                        items:
                          type: string
                        type: array
                      drop:
                        items:
                          type: string
                        type: array
                    type: object
                  readOnlyRootFilesystem:
                    nullable: true
                    type: boolean
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                type: object
              credentialsSecret:
                type: string
              enableServiceLinks:
                description: |-
                  `enableServiceLinks` on the StatefulSet PodSpec. The object store
                  (`s3`/SeaweedFS) MUST set this `false`: k8s's default-`true` injects a
                  `*_SERVICE_HOST/PORT` env var for every Service in the namespace, and the
                  s3 flag parser aborts startup on the unexpected vars. This is the field
                  the datastore path uniquely needs (the object store is a datastore role);
                  `None` ⇒ the field is omitted (k8s default `true`), byte-identical for
                  every datastore that does not set it.
                nullable: true
                type: boolean
              env:
                items:
                  properties:
                    name:
                      type: string
                    value:
                      nullable: true
                      type: string
                    valueFrom:
                      nullable: true
                      properties:
                        configMapKeyRef:
                          nullable: true
                          properties:
