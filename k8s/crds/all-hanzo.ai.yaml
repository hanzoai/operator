---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: services.hanzo.ai
spec:
  group: hanzo.ai
  names:
    categories: []
    kind: Service
    plural: services
    shortNames:
    - hsvc
    singular: service
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.image.repository
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ServiceSpec via `CustomResource`
        properties:
          spec:
            properties:
              annotations:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              args:
                items:
                  type: string
                type: array
              autoscaling:
                nullable: true
                properties:
                  enabled:
                    default: false
                    type: boolean
                  maxReplicas:
                    format: int32
                    nullable: true
                    type: integer
                  minReplicas:
                    format: int32
                    nullable: true
                    type: integer
                  targetCpuUtilization:
                    format: int32
                    nullable: true
                    type: integer
                  targetMemoryUtilization:
                    format: int32
                    nullable: true
                    type: integer
                type: object
              command:
                items:
                  type: string
                type: array
              component:
                type: string
              containerSecurityContext:
                description: |-
                  Container-level `securityContext` for the MAIN container —
                  `readOnlyRootFilesystem`, `allowPrivilegeEscalation`,
                  `capabilities{drop,add}`, `runAsNonRoot`, `runAsUser` — rendered onto the
                  main container's `securityContext`. This is the fleet hardening baseline
                  (`readOnlyRootFilesystem: true` + `capabilities.drop: [ALL]` +
                  `allowPrivilegeEscalation: false`) that the LLM-key-holding and
                  cluster-admin workloads set; porting them without it silently DROPS the
                  hardening. Opt-in — an omitting CR renders a byte-identical container.
                nullable: true
                properties:
                  allowPrivilegeEscalation:
                    nullable: true
                    type: boolean
                  capabilities:
                    description: |-
                      Linux `capabilities` to add/drop on a container (mirror of k8s
                      `Capabilities`). The fleet baseline is `drop: [ALL]`.
                    nullable: true
                    properties:
                      add:
                        items:
                          type: string
                        type: array
                      drop:
                        items:
                          type: string
                        type: array
                    type: object
                  readOnlyRootFilesystem:
                    nullable: true
                    type: boolean
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                type: object
              enableServiceLinks:
                description: |-
                  `enableServiceLinks` on the PodSpec. The object store (`s3`/SeaweedFS)
                  MUST set this `false`: k8s's default-`true` injects a
                  `*_SERVICE_HOST/PORT` env var for every Service in the namespace, and the
                  s3 flag parser aborts startup on the unexpected vars. `None` ⇒ the field
                  is omitted (k8s default `true`), byte-identical for every CR that does not
                  set it.
                nullable: true
                type: boolean
              env:
                items:
                  properties:
                    name:
                      type: string
                    value:
                      nullable: true
                      type: string
                    valueFrom:
                      nullable: true
                      properties:
                        configMapKeyRef:
                          nullable: true
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            optional:
                              nullable: true
                              type: boolean
                          required:
                          - key
                          - name
                          type: object
                        fieldRef:
                          nullable: true
                          properties:
                            apiVersion:
                              type: string
                            fieldPath:
                              type: string
                          required:
                          - fieldPath
                          type: object
                        secretKeyRef:
                          nullable: true
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            optional:
                              nullable: true
                              type: boolean
                          required:
                          - key
                          - name
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              envFrom:
                items:
                  properties:
                    configMapRef:
                      nullable: true
                      properties:
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                    prefix:
                      type: string
                    secretRef:
                      nullable: true
                      properties:
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                  type: object
                type: array
              fsGroup:
                description: |-
                  Pod-level `securityContext.fsGroup`. Set this when a NON-root image
                  (e.g. `esign` runs as uid 1001) must write a `persistence` PVC: the
                  kubelet chowns the volume to this GID + adds it to every container's
                  supplementary groups, so the app can write. Omit for root images
                  (e.g. `console`), which already write any volume. Opt-in so changing
                  it never restarts unrelated persistence services.
                format: int64
                nullable: true
                type: integer
              image:
                default:
                  repository: ''
                description: |-
                  `#[serde(default)]`: image is optional at the wire level so the `App`
                  Kind (which flattens `ServiceSpec`) deserializes the imageless role
                  profiles — a `role: dns` / `role: ingress` App CR carries NO `image`
                  (its image is fixed by the delegate controller). Rejects no existing
                  `Service`/`App` CR (every workload profile still sets it) and matches the
                  merged universe App schema, which models `image` as non-required.
                properties:
                  pullPolicy:
                    type: string
                  repository:
                    type: string
                  tag:
                    type: string
                required:
                - repository
                type: object
              imagePullSecrets:
                items:
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              ingress:
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                  clusterIssuer:
                    type: string
                  enabled:
                    default: false
                    type: boolean
                  hosts:
                    items:
                      type: string
                    type: array
                  ingressClassName:
                    type: string
                  pathRules:
                    items:
                      properties:
                        path:
                          type: string
                        pathType:
                          type: string
                        port:
                          format: int32
                          type: integer
                        serviceName:
                          type: string
                      required:
                      - path
                      - pathType
                      - port
                      type: object
                    type: array
                  tls:
                    default: true
                    type: boolean
                  zeroTrustPolicy:
                    nullable: true
                    properties:
                      allowedDomains:
                        items:
                          type: string
                        type: array
                      allowedEmails:
                        items:
                          type: string
                        type: array
                      allowedGroups:
                        items:
                          type: string
                        type: array
                      enabled:
                        default: false
                        type: boolean
                      iamEndpoint:
                        type: string
                      sessionDuration:
                        type: string
                    type: object
                type: object
              initContainers:
                items:
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      items:
                        type: string
                      type: array
                    env:
                      items:
                        properties:
                          name:
                            type: string
                          value:
                            nullable: true
                            type: string
                          valueFrom:
                            nullable: true
                            properties:
                              configMapKeyRef:
                                nullable: true
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    nullable: true
                                    type: boolean
                                required:
                                - key
                                - name
                                type: object
                              fieldRef:
                                nullable: true
                                properties:
                                  apiVersion:
                                    type: string
                                  fieldPath:
                                    type: string
                                required:
                                - fieldPath
                                type: object
                              secretKeyRef:
                                nullable: true
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    nullable: true
                                    type: boolean
                                required:
                                - key
                                - name
                                type: object
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    envFrom:
                      items:
                        properties:
                          configMapRef:
                            nullable: true
                            properties:
                              name:
                                type: string
                              optional:
                                nullable: true
                                type: boolean
                            required:
                            - name
                            type: object
                          prefix:
                            type: string
                          secretRef:
                            nullable: true
                            properties:
                              name:
                                type: string
                              optional:
                                nullable: true
                                type: boolean
                            required:
                            - name
                            type: object
                        type: object
                      type: array
                    image:
                      type: string
                    imagePullPolicy:
                      description: Image pull policy (Always / IfNotPresent / Never).
                      type: string
                    name:
                      type: string
                    volumeMounts:
                      items:
                        properties:
                          mountPath:
                            type: string
                          name:
                            type: string
                          readOnly:
                            nullable: true
                            type: boolean
                          subPath:
                            type: string
                        required:
                        - mountPath
                        - name
                        type: object
                      type: array
                  required:
                  - image
                  - name
                  type: object
                type: array
              kmsSecrets:
                items:
                  properties:
                    credentialsRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    envSlug:
                      type: string
                    hostApi:
                      type: string
                    managedSecretName:
                      type: string
                    projectSlug:
                      type: string
                    resyncInterval:
                      default: 0
                      format: int32
                      type: integer
                    secretsPath:
                      type: string
                  required:
                  - credentialsRef
                  - envSlug
                  - managedSecretName
                  - projectSlug
                  - secretsPath
                  type: object
                type: array
              labels:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              livenessProbe:
                nullable: true
                properties:
                  exec:
                    description: '`exec` handler — probe succeeds when the command exits 0.'
                    nullable: true
                    properties:
                      command:
                        default: []
                        items:
                          type: string
                        type: array
                    type: object
                  initialDelaySeconds:
                    default: 0
                    format: int32
                    type: integer
                  path:
                    default: ''
                    description: |-
                      `httpGet` path. Used only when no `exec`/`tcpSocket` handler is set and
                      `port > 0`.
                    type: string
                  periodSeconds:
                    default: 0
                    format: int32
                    type: integer
                  port:
                    default: 0
                    description: |-
                      `httpGet` port. `0` (the default) means "no HTTP handler" — set an
                      `exec` or `tcpSocket` handler instead for non-HTTP health checks
                      (Postgres `pg_isready`, Valkey `redis-cli ping`, a Kafka TCP listener).
                      Optional so a CR can declare an `exec`/`tcpSocket`-only probe; the old
                      schema made `port` required, which forced every probe to be HTTP and
                      silently mangled exec/tcpSocket probes into an invalid `httpGet{port:0}`.
                    format: int32
                    type: integer
                  tcpSocket:
                    description: |-
                      `tcpSocket` handler — probe succeeds when the TCP port accepts a
                      connection. Mutually exclusive with `httpGet`/`exec` (exec wins, then
                      tcpSocket, then httpGet).
                    nullable: true
                    properties:
                      port:
                        format: int32
                        type: integer
                    required:
                    - port
                    type: object
                type: object
              networkPolicy:
                nullable: true
                properties:
                  allowFrom:
                    items:
                      properties:
                        namespaceSelector:
                          nullable: true
                          properties:
                            matchLabels:
                              additionalProperties:
                                type: string
                              nullable: true
                              type: object
                          type: object
                        podSelector:
                          nullable: true
                          properties:
                            matchLabels:
                              additionalProperties:
                                type: string
                              nullable: true
                              type: object
                          type: object
                      type: object
                    type: array
                  allowIngress:
                    default: false
                    type: boolean
                  allowIntraNamespace:
                    nullable: true
                    type: boolean
                  enabled:
                    nullable: true
                    type: boolean
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  `PodSpec.nodeSelector` — the hard "only nodes with these labels" filter.
                  Prefer this over an inflated `resources.requests` when the intent is
                  placement: it says so out loud, and it keeps the request honest.
                nullable: true
                type: object
              partOf:
                type: string
              pdb:
                nullable: true
                properties:
                  enabled:
                    default: false
                    type: boolean
                  maxUnavailable:
                    format: int32
                    nullable: true
                    type: integer
                  minAvailable:
                    format: int32
                    nullable: true
                    type: integer
                type: object
              persistence:
                description: |-
                  Durable SeaweedFS-backed SQLite via `hanzoai/replicate`. ONE field
                  auto-wires the restore init + replication sidecar + ConfigMap + PVC.
                nullable: true
                properties:
                  ageSecret:
                    description: |-
                      K8s Secret with `identity` / `recipients` (age keypair). Default
                      `<service-name>-replicate-age`.
                    type: string
                  bucket:
                    description: SeaweedFS bucket, e.g. `console-db` (or `<org>-db`).
                    type: string
                  credentialsSecret:
                    description: K8s Secret with `access-key` / `secret-key`. Default `s3-credentials`.
                    type: string
                  dataDir:
                    description: |-
                      Mount path shared by the main container, the restore init, and the
                      sidecar, e.g. `/var/lib/hanzo/console`.
                    type: string
                  dbPath:
                    description: |-
                      Single-DB file relative to `data_dir`, e.g. `"app.db"`. Used when
                      `!dir_mode`.
                    type: string
                  dirMode:
                    default: false
                    description: |-
                      Per-org/user/project fan-out: `replicate` watches `data_dir` for many
                      DBs instead of a single file.
                    type: boolean
                  enabled:
                    default: false
                    type: boolean
                  forcePathStyle:
                    default: true
                    description: |-
                      SeaweedFS requires path-style addressing (subdomain buckets don't
                      resolve in-cluster). Default `true`.
                    type: boolean
                  image:
                    description: '`hanzoai/replicate` image. Default the pinned semver.'
                    type: string
                  pattern:
                    description: Glob used in `dir_mode`. Default `**/*.db`.
                    type: string
                  s3Endpoint:
                    description: |-
                      S3 endpoint. MUST keep the `http://` scheme — replicate's S3 client
                      prepends `https://` to a scheme-less endpoint, which the cleartext
                      in-cluster `s3` service rejects. Default `http://s3.hanzo.svc:9000`.
                    type: string
                  s3Path:
                    description: S3 key prefix, e.g. `console/app`.
                    type: string
                  s3Region:
                    description: S3 region. Default `us-east-1`.
                    type: string
                  storage:
                    description: PVC size/class for the `app-db` working volume. `None` → emptyDir.
                    nullable: true
                    properties:
                      retentionPolicy:
                        type: string
                      size:
                        description: Quantity string (e.g. `"10Gi"`).
                        type: string
                      storageClassName:
                        type: string
                      volumeName:
                        description: |-
                          Name of the `volumeClaimTemplate` (and the auto-injected data mount).
                          Defaults to `"data"`. This is an IMMUTABLE StatefulSet field, so a
                          datastore adopting a pre-existing StatefulSet MUST set this to the
                          existing template's name (e.g. `sql-data` / `kv-data`) — otherwise the
                          apply is rejected (`updates to statefulset spec ... are forbidden`) and
                          the workload stops reconciling. New datastores can omit it.
                        nullable: true
                        type: string
                    required:
                    - size
                    type: object
                type: object
              ports:
                items:
                  properties:
                    containerPort:
                      format: int32
                      type: integer
                    name:
                      type: string
                    protocol:
                      type: string
                    servicePort:
                      format: int32
                      nullable: true
                      type: integer
                  required:
                  - containerPort
                  - name
                  type: object
                type: array
              priorityClassName:
                description: |-
                  `PodSpec.priorityClassName` — the name of an existing PriorityClass.
                  This is the field that makes a seat survive the `Recreate` window: a
                  higher-priority pod PREEMPTS a lower-priority squatter rather than going
                  Pending behind it. The referenced PriorityClass is cluster-scoped and is
                  NOT created here — naming one that does not exist makes the apiserver
                  reject the pod, so it fails loudly rather than silently placing wrong.
                type: string
              readinessProbe:
                nullable: true
                properties:
                  exec:
                    description: '`exec` handler — probe succeeds when the command exits 0.'
                    nullable: true
                    properties:
                      command:
                        default: []
                        items:
                          type: string
                        type: array
                    type: object
                  initialDelaySeconds:
                    default: 0
                    format: int32
                    type: integer
                  path:
                    default: ''
                    description: |-
                      `httpGet` path. Used only when no `exec`/`tcpSocket` handler is set and
                      `port > 0`.
                    type: string
                  periodSeconds:
                    default: 0
                    format: int32
                    type: integer
                  port:
                    default: 0
                    description: |-
                      `httpGet` port. `0` (the default) means "no HTTP handler" — set an
                      `exec` or `tcpSocket` handler instead for non-HTTP health checks
                      (Postgres `pg_isready`, Valkey `redis-cli ping`, a Kafka TCP listener).
                      Optional so a CR can declare an `exec`/`tcpSocket`-only probe; the old
                      schema made `port` required, which forced every probe to be HTTP and
                      silently mangled exec/tcpSocket probes into an invalid `httpGet{port:0}`.
                    format: int32
                    type: integer
                  tcpSocket:
                    description: |-
                      `tcpSocket` handler — probe succeeds when the TCP port accepts a
                      connection. Mutually exclusive with `httpGet`/`exec` (exec wins, then
                      tcpSocket, then httpGet).
                    nullable: true
                    properties:
                      port:
                        format: int32
                        type: integer
                    required:
                    - port
                    type: object
                type: object
              replicas:
                format: int32
                nullable: true
                type: integer
              resources:
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    description: Map of resource name (e.g. `cpu`, `memory`) to quantity string.
                    nullable: true
                    type: object
                type: object
              securityContext:
                description: |-
                  Pod-level `securityContext` passthrough — `runAsNonRoot`, `runAsUser`,
                  `runAsGroup`, `fsGroup`, `seccompProfile` — rendered onto the PodSpec's
                  `securityContext`. The legacy top-level `fsGroup` above folds together
                  with this: `securityContext.fsGroup` wins when both are set, otherwise the
                  top-level value is carried. Opt-in — a CR that omits it renders a
                  byte-identical PodSpec (a CR that sets only the legacy `fsGroup` still
                  renders exactly `securityContext: {fsGroup: N}` as before).
                nullable: true
                properties:
                  fsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  fsGroupChangePolicy:
                    description: |-
                      WHEN the kubelet applies `fsGroup` ownership to a mounted volume. Kubernetes
                      defines exactly two values, so this is a closed enum rather than the open
                      strings used for values WE own (`role`, `strategy`): the set cannot grow
                      under us, there is no forward-compat story a typo could be serving, and the
                      CRD schema then carries `enum: [Always, OnRootMismatch]` so a typo is refused
                      at admission instead of stored and later rejected by the apiserver on the pod
                      apply (which wedges the reconcile in a requeue loop).
                    enum:
                    - Always
                    - OnRootMismatch
                    nullable: true
                    type: string
                  runAsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                  seccompProfile:
                    description: |-
                      `seccompProfile` (mirror of k8s `SeccompProfile`). `type` is required
                      (`RuntimeDefault` / `Localhost` / `Unconfined`); `localhostProfile` is set
                      only for `type: Localhost`.
                    nullable: true
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    required:
                    - type
                    type: object
                type: object
              serviceAccountName:
                type: string
              serviceMonitor:
                nullable: true
                properties:
                  enabled:
                    default: false
                    type: boolean
                  interval:
                    type: string
                  metricsPath:
                    type: string
                  metricsPort:
                    type: string
                type: object
              sidecars:
                items:
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      items:
                        type: string
                      type: array
                    env:
                      items:
                        properties:
                          name:
                            type: string
                          value:
                            nullable: true
                            type: string
                          valueFrom:
                            nullable: true
                            properties:
                              configMapKeyRef:
                                nullable: true
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    nullable: true
                                    type: boolean
                                required:
                                - key
                                - name
                                type: object
                              fieldRef:
                                nullable: true
                                properties:
                                  apiVersion:
                                    type: string
                                  fieldPath:
                                    type: string
                                required:
                                - fieldPath
                                type: object
                              secretKeyRef:
                                nullable: true
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    nullable: true
                                    type: boolean
                                required:
                                - key
                                - name
                                type: object
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    envFrom:
                      items:
                        properties:
                          configMapRef:
                            nullable: true
                            properties:
                              name:
                                type: string
                              optional:
                                nullable: true
                                type: boolean
                            required:
                            - name
                            type: object
                          prefix:
                            type: string
                          secretRef:
                            nullable: true
                            properties:
                              name:
                                type: string
                              optional:
                                nullable: true
                                type: boolean
                            required:
                            - name
                            type: object
                        type: object
                      type: array
                    image:
                      type: string
                    imagePullPolicy:
                      description: Image pull policy (Always / IfNotPresent / Never).
                      type: string
                    name:
                      type: string
                    volumeMounts:
                      items:
                        properties:
                          mountPath:
                            type: string
                          name:
                            type: string
                          readOnly:
                            nullable: true
                            type: boolean
                          subPath:
                            type: string
                        required:
                        - mountPath
                        - name
                        type: object
                      type: array
                  required:
                  - image
                  - name
                  type: object
                type: array
              strategy:
                type: string
              surgeColocation:
                description: |-
                  Opt in to a zero-downtime, same-node handoff for a RollingUpdate service
                  whose data is a single ReadWriteOnce PVC. When true (and strategy is not
                  Recreate and a PVC is mounted) the operator injects a soft self-podAffinity
                  (`manifests::colocation_affinity`) so the surge pod co-locates on the
                  volume's node and bind-mounts the already-attached volume — no Multi-Attach
                  deadlock, no reattach gap. ONLY set this for a store safe under a brief
                  same-host two-pod overlap (SQLite WAL + busy_timeout). An exclusive-lock
                  single-open engine (Badger/LMDB/Meili, Qdrant) must use `strategy: Recreate`
                  instead — leave this false. Default false (untouched).
                type: boolean
              tolerations:
                description: |-
                  `PodSpec.tolerations` — lets this workload onto tainted nodes. The
                  companion to `nodeSelector` for a DEDICATED pool: taint the pool so
                  nothing else lands there, then tolerate the taint here. That pair is a
                  real reservation; a big memory request is not.
                items:
                  description: |-
                    A single `PodSpec.tolerations` entry. Wire-identical to k8s core/v1
                    `Toleration` — same keys, same optionality — so a CR author transcribes a
                    toleration from any k8s doc verbatim.
                  properties:
                    effect:
                      description: '`NoSchedule` / `PreferNoSchedule` / `NoExecute`. Empty matches all effects.'
                      nullable: true
                      type: string
                    key:
                      nullable: true
                      type: string
                    operator:
                      description: '`Equal` (default) or `Exists`. `Exists` with no `key` tolerates all taints.'
                      nullable: true
                      type: string
                    tolerationSeconds:
                      description: |-
                        Only meaningful with `effect: NoExecute` — how long the pod stays bound
                        after the taint is added. Absent = forever.
                      format: int64
                      nullable: true
                      type: integer
                    value:
                      nullable: true
                      type: string
                  type: object
                type: array
              upgradePolicy:
                description: |-
                  Managed-upgrade policy. OPT-IN: when absent, `spec.image` is applied
                  directly (historical behavior). When `enabled` (+ the operator's
                  `UPGRADE_FSM_ENABLED` gate), an image change rolls through the
                  pre-flight → health-gate → auto-rollback FSM (see `controllers::upgrade`).
                nullable: true
                properties:
                  bootEnv:
                    description: |-
                      Boot-only env overlaid on the pre-flight candidate pod so it runs its
                      migrate + mount path WITHOUT real side effects (no prod notifications /
                      billing / outbound). e.g. `CLOUD_ENV=smoke`. The pre-flight pod is never
                      wired to a Service, is isolated by a deny-all-egress NetworkPolicy, mounts
                      a CLONE (never the live PVC), and — with this env — makes no outbound
                      calls. REQUIRED for a stateful FSM-enabled Service (the pre-flight boots
                      the real image with the real master key over a clone of live data): the
                      operator refuses to start such an upgrade without it. Set your app's
                      boot-only marker here.
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          nullable: true
                          type: string
                        valueFrom:
                          nullable: true
                          properties:
                            configMapKeyRef:
                              nullable: true
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  nullable: true
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                            fieldRef:
                              nullable: true
                              properties:
                                apiVersion:
                                  type: string
                                fieldPath:
                                  type: string
                              required:
                              - fieldPath
                              type: object
                            secretKeyRef:
                              nullable: true
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  nullable: true
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  enabled:
                    default: false
                    description: |-
                      Master per-CR switch. `false`/absent ⇒ the operator applies `spec.image`
                      directly (historical behavior). `true` (+ the `UPGRADE_FSM_ENABLED`
                      cluster gate) ⇒ image changes roll through the pre-flight → health →
                      rollback FSM.
                    type: boolean
                  preflight:
                    description: |-
                      Boot the candidate against a CSI-snapshot CLONE of the live data
                      (mounted at the persistence `dataDir`) BEFORE flipping production. This
                      is the operator-side analog of cloud's CI migration-smoke: it catches the
                      index-before-ADD-COLUMN migration-crash class that only manifests over
                      real historical schema. Default: `true` when the Service has
                      `persistence`; a stateless Service pre-flights a boot-only candidate pod
                      (no clone). Set `false` to skip the pre-flight and rely on the
                      health-gated rollout + auto-rollback alone.
                    nullable: true
                    type: boolean
                  preflightDeadlineSeconds:
                    description: |-
                      Seconds the pre-flight candidate boot may take to reach Ready before the
                      pre-flight is judged failed (a migration/boot crash). Default 300,
                      floored at 30.
                    format: int64
                    nullable: true
                    type: integer
                  rolloutDeadlineSeconds:
                    description: |-
                      Seconds the health-gated rollout may take to reach Ready before the
                      operator auto-rolls-back to `lastGoodImage`. Default 300, floored at 30.
                    format: int64
                    nullable: true
                    type: integer
                  snapshotClass:
                    description: |-
                      `VolumeSnapshotClass` for the pre-flight CSI snapshot of the live data
                      PVC. Empty ⇒ the cluster's default VolumeSnapshotClass. A stateful
                      pre-flight with no snapshot support FAILS the upgrade CLOSED (never flips
                      without a pre-flight).
                    type: string
                  soakSeconds:
                    description: |-
                      Seconds the candidate must remain continuously healthy in production
                      (the soak window) AFTER the rollout completes before the upgrade is judged
                      Succeeded and `lastGoodImage` advances. Catches a candidate that rolls out
                      healthy then crash-loops under load — it is rolled back instead of
                      poisoning last-good. Default 60. `0` opts out (commit on first healthy
                      observation, the pre-soak behavior).
                    format: int64
                    nullable: true
                    type: integer
                type: object
              volumeMounts:
                items:
                  properties:
                    mountPath:
                      type: string
                    name:
                      type: string
                    readOnly:
                      nullable: true
                      type: boolean
                    subPath:
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              volumes:
                items:
                  description: |-
                    A pod volume: a name plus exactly one typed source. Each source is a real
                    object schema (not a freeform `serde_json::Value`), so it survives into the
                    generated structural CRD — a `serde_json::Value` source renders as an
                    untyped blob that the apiserver prunes, which silently dropped `configMap` /
                    `persistentVolumeClaim` from `spec.volumes[*]` and broke config/PVC mounts.
                  properties:
                    configMap:
                      description: '`configMap` volume source — mounts a ConfigMap by name.'
                      nullable: true
                      properties:
                        defaultMode:
                          format: int32
                          nullable: true
                          type: integer
                        items:
                          items:
                            description: One key→path projection inside a `configMap` / `secret` volume source.
                            properties:
                              key:
                                type: string
                              mode:
                                format: int32
                                nullable: true
                                type: integer
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                    emptyDir:
                      description: '`emptyDir` volume source — an ephemeral scratch volume.'
                      nullable: true
                      properties:
                        medium:
                          nullable: true
                          type: string
                        sizeLimit:
                          nullable: true
                          type: string
                      type: object
                    name:
                      type: string
                    persistentVolumeClaim:
                      description: '`persistentVolumeClaim` volume source — mounts an existing PVC.'
                      nullable: true
                      properties:
                        claimName:
                          type: string
                        readOnly:
                          nullable: true
                          type: boolean
                      required:
                      - claimName
                      type: object
                    secret:
                      description: '`secret` volume source — mounts a Secret by name.'
                      nullable: true
                      properties:
                        defaultMode:
                          format: int32
                          nullable: true
                          type: integer
                        items:
                          items:
                            description: One key→path projection inside a `configMap` / `secret` volume source.
                            properties:
                              key:
                                type: string
                              mode:
                                format: int32
                                nullable: true
                                type: integer
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        optional:
                          nullable: true
                          type: boolean
                        secretName:
                          type: string
                      required:
                      - secretName
                      type: object
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            nullable: true
            properties:
              availableReplicas:
                default: 0
                format: int32
                type: integer
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                items:
                  type: string
                type: array
              lastGoodImage:
                description: |-
                  The last image proven healthy in production — the auto-rollback target
                  for the managed-upgrade FSM. Adopted from the running image the first
                  time the operator observes the Service healthy; advanced to the candidate
                  only after the candidate is proven healthy in production.
                nullable: true
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Creating
                - Running
                - Degraded
                - Deleting
                - null
                nullable: true
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
              upgrade:
                description: |-
                  The in-flight upgrade FSM state (absent ⇒ Stable). Fully derived from the
                  spec + cluster each reconcile, so the FSM resumes across operator restart.
                nullable: true
                properties:
                  deadlineAt:
                    description: |-
                      RFC3339 — the deadline for the CURRENT phase. Past it ⇒ the phase fails
                      to its rollback/terminal state.
                    type: string
                  message:
                    description: Human-readable last transition reason.
                    type: string
                  phase:
                    description: |-
                      Upgrade FSM phase. Absent `status.upgrade` ⇒ Stable (no upgrade in flight).
                      Mirrors `controllers::upgrade::Phase` on the wire.
                    enum:
                    - Preflighting
                    - Rolling
                    - RollingBack
                    - Failed
                    nullable: true
                    type: string
                  preflightClone:
                    description: The CSI clone PVC the pre-flight mounts. GC'd on pre-flight completion.
                    type: string
                  preflightPod:
                    description: |-
                      The pre-flight Pod (deterministically named by target) booting the
                      candidate. Present only in Preflighting.
                    type: string
                  preflightSnapshot:
                    description: |-
                      The CSI VolumeSnapshot the clone derives from. GC'd on pre-flight
                      completion.
                    type: string
                  stableSince:
                    description: |-
                      RFC3339 — when the rolling candidate was FIRST observed healthy in
                      production. The soak window (`upgradePolicy.soakSeconds`) must elapse from
                      this instant of continuous health before the upgrade is judged Succeeded
                      and `lastGoodImage` advances. Reset to empty whenever the candidate is
                      observed unhealthy, so a flapping candidate never commits. Present only in
                      Rolling, after the first healthy observation.
                    type: string
                  startedAt:
                    description: RFC3339 — when this upgrade attempt began.
                    type: string
                  targetImage:
                    description: The image this upgrade is driving toward (`spec.image` when it began).
                    type: string
                required:
                - targetImage
                type: object
              upgradeHistory:
                description: Bounded history (most-recent-last) of concluded upgrade attempts.
                items:
                  description: One completed upgrade attempt, appended to `status.upgradeHistory`.
                  properties:
                    at:
                      description: RFC3339 — when the attempt concluded.
                      type: string
                    fromImage:
                      description: The image production ran before the attempt.
                      type: string
                    image:
                      description: The candidate image the attempt targeted.
                      type: string
                    message:
                      type: string
                    result:
                      description: '`Succeeded` | `RolledBack` | `PreflightFailed` | `Superseded`.'
                      type: string
                  required:
                  - image
                  - result
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Service
        type: object
    served: true
    storage: true
    subresources:
      status: {}
