                description: |-
                  Durable SeaweedFS-backed SQLite via `hanzoai/replicate`. ONE field
                  auto-wires the restore init + replication sidecar + ConfigMap + PVC.
                nullable: true
                properties:
                  ageSecret:
                    description: |-
                      K8s Secret with `identity` / `recipients` (age keypair). Default
                      `<service-name>-replicate-age`.
                    type: string
                  bucket:
                    description: SeaweedFS bucket, e.g. `console-db` (or `<org>-db`).
                    type: string
                  credentialsSecret:
                    description: K8s Secret with `access-key` / `secret-key`. Default `s3-credentials`.
                    type: string
                  dataDir:
                    description: |-
                      Mount path shared by the main container, the restore init, and the
                      sidecar, e.g. `/var/lib/hanzo/console`.
                    type: string
                  dbPath:
                    description: |-
                      Single-DB file relative to `data_dir`, e.g. `"app.db"`. Used when
                      `!dir_mode`.
                    type: string
                  dirMode:
                    default: false
                    description: |-
                      Per-org/user/project fan-out: `replicate` watches `data_dir` for many
                      DBs instead of a single file.
                    type: boolean
                  enabled:
                    default: false
                    type: boolean
                  forcePathStyle:
                    default: true
                    description: |-
                      SeaweedFS requires path-style addressing (subdomain buckets don't
                      resolve in-cluster). Default `true`.
                    type: boolean
                  image:
                    description: '`hanzoai/replicate` image. Default the pinned semver.'
                    type: string
                  pattern:
                    description: Glob used in `dir_mode`. Default `**/*.db`.
                    type: string
                  s3Endpoint:
                    description: |-
                      S3 endpoint. MUST keep the `http://` scheme — replicate's S3 client
                      prepends `https://` to a scheme-less endpoint, which the cleartext
                      in-cluster `s3` service rejects. Default `http://s3.hanzo.svc:9000`.
                    type: string
                  s3Path:
                    description: S3 key prefix, e.g. `console/app`.
                    type: string
                  s3Region:
                    description: S3 region. Default `us-east-1`.
                    type: string
                  storage:
                    description: PVC size/class for the `app-db` working volume. `None` → emptyDir.
