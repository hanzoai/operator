                        type: object
                      type: array
                  required:
                  - image
                  - name
                  type: object
                type: array
              storage:
                properties:
                  retentionPolicy:
                    type: string
                  size:
                    description: Quantity string (e.g. `"10Gi"`).
                    type: string
                  storageClassName:
