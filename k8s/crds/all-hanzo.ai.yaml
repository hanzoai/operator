                      a CLONE (never the live PVC), and — with this env — makes no outbound
                      calls. REQUIRED for a stateful FSM-enabled Service (the pre-flight boots
                      the real image with the real master key over a clone of live data): the
                      operator refuses to start such an upgrade without it. Set your app's
                      boot-only marker here.
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          nullable: true
                          type: string
                        valueFrom:
                          nullable: true
                          properties:
                            configMapKeyRef:
                              nullable: true
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  nullable: true
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                            fieldRef:
                              nullable: true
                              properties:
                                apiVersion:
                                  type: string
                                fieldPath:
                                  type: string
                              required:
                              - fieldPath
                              type: object
                            secretKeyRef:
                              nullable: true
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  nullable: true
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  enabled:
                    default: false
                    description: |-
                      Master per-CR switch. `false`/absent ⇒ the operator applies `spec.image`
                      directly (historical behavior). `true` (+ the `UPGRADE_FSM_ENABLED`
                      cluster gate) ⇒ image changes roll through the pre-flight → health →
                      rollback FSM.
                    type: boolean
                  preflight:
                    description: |-
                      Boot the candidate against a CSI-snapshot CLONE of the live data
                      (mounted at the persistence `dataDir`) BEFORE flipping production. This
                      is the operator-side analog of cloud's CI migration-smoke: it catches the
                      index-before-ADD-COLUMN migration-crash class that only manifests over
                      real historical schema. Default: `true` when the Service has
                      `persistence`; a stateless Service pre-flights a boot-only candidate pod
                      (no clone). Set `false` to skip the pre-flight and rely on the
                      health-gated rollout + auto-rollback alone.
                    nullable: true
                    type: boolean
                  preflightDeadlineSeconds:
                    description: |-
                      Seconds the pre-flight candidate boot may take to reach Ready before the
                      pre-flight is judged failed (a migration/boot crash). Default 300,
                      floored at 30.
                    format: int64
                    nullable: true
                    type: integer
                  rolloutDeadlineSeconds:
                    description: |-
                      Seconds the health-gated rollout may take to reach Ready before the
                      operator auto-rolls-back to `lastGoodImage`. Default 300, floored at 30.
                    format: int64
                    nullable: true
                    type: integer
                  snapshotClass:
                    description: |-
                      `VolumeSnapshotClass` for the pre-flight CSI snapshot of the live data
                      PVC. Empty ⇒ the cluster's default VolumeSnapshotClass. A stateful
                      pre-flight with no snapshot support FAILS the upgrade CLOSED (never flips
                      without a pre-flight).
                    type: string
                  soakSeconds:
                    description: |-
                      Seconds the candidate must remain continuously healthy in production
                      (the soak window) AFTER the rollout completes before the upgrade is judged
                      Succeeded and `lastGoodImage` advances. Catches a candidate that rolls out
                      healthy then crash-loops under load — it is rolled back instead of
                      poisoning last-good. Default 60. `0` opts out (commit on first healthy
                      observation, the pre-soak behavior).
                    format: int64
                    nullable: true
                    type: integer
                type: object
              volumeMounts:
                items:
                  properties:
                    mountPath:
                      type: string
                    name:
                      type: string
                    readOnly:
                      nullable: true
                      type: boolean
                    subPath:
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              volumes:
                items:
                  description: |-
                    A pod volume: a name plus exactly one typed source. Each source is a real
                    object schema (not a freeform `serde_json::Value`), so it survives into the
                    generated structural CRD — a `serde_json::Value` source renders as an
                    untyped blob that the apiserver prunes, which silently dropped `configMap` /
                    `persistentVolumeClaim` from `spec.volumes[*]` and broke config/PVC mounts.
                  properties:
                    configMap:
                      description: '`configMap` volume source — mounts a ConfigMap by name.'
                      nullable: true
                      properties:
                        defaultMode:
                          format: int32
                          nullable: true
                          type: integer
                        items:
                          items:
                            description: One key→path projection inside a `configMap` / `secret` volume source.
                            properties:
                              key:
                                type: string
                              mode:
                                format: int32
                                nullable: true
                                type: integer
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        name:
                          type: string
                        optional:
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                    emptyDir:
                      description: '`emptyDir` volume source — an ephemeral scratch volume.'
                      nullable: true
                      properties:
                        medium:
                          nullable: true
                          type: string
                        sizeLimit:
                          nullable: true
                          type: string
                      type: object
                    name:
                      type: string
                    persistentVolumeClaim:
                      description: '`persistentVolumeClaim` volume source — mounts an existing PVC.'
                      nullable: true
                      properties:
                        claimName:
                          type: string
                        readOnly:
                          nullable: true
                          type: boolean
                      required:
                      - claimName
                      type: object
                    secret:
                      description: '`secret` volume source — mounts a Secret by name.'
                      nullable: true
                      properties:
                        defaultMode:
                          format: int32
                          nullable: true
                          type: integer
                        items:
                          items:
                            description: One key→path projection inside a `configMap` / `secret` volume source.
                            properties:
                              key:
                                type: string
                              mode:
                                format: int32
                                nullable: true
                                type: integer
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        optional:
                          nullable: true
                          type: boolean
                        secretName:
                          type: string
                      required:
                      - secretName
                      type: object
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            nullable: true
            properties:
              availableReplicas:
                default: 0
                format: int32
                type: integer
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                items:
                  type: string
                type: array
              lastGoodImage:
                description: |-
                  The last image proven healthy in production — the auto-rollback target
                  for the managed-upgrade FSM. Adopted from the running image the first
                  time the operator observes the Service healthy; advanced to the candidate
                  only after the candidate is proven healthy in production.
                nullable: true
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Creating
                - Running
                - Degraded
                - Deleting
                - null
                nullable: true
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
              upgrade:
                description: |-
                  The in-flight upgrade FSM state (absent ⇒ Stable). Fully derived from the
                  spec + cluster each reconcile, so the FSM resumes across operator restart.
                nullable: true
                properties:
                  deadlineAt:
                    description: |-
                      RFC3339 — the deadline for the CURRENT phase. Past it ⇒ the phase fails
                      to its rollback/terminal state.
                    type: string
                  message:
                    description: Human-readable last transition reason.
                    type: string
                  phase:
                    description: |-
                      Upgrade FSM phase. Absent `status.upgrade` ⇒ Stable (no upgrade in flight).
                      Mirrors `controllers::upgrade::Phase` on the wire.
                    enum:
                    - Preflighting
                    - Rolling
                    - RollingBack
                    - Failed
                    nullable: true
                    type: string
                  preflightClone:
                    description: The CSI clone PVC the pre-flight mounts. GC'd on pre-flight completion.
                    type: string
                  preflightPod:
                    description: |-
                      The pre-flight Pod (deterministically named by target) booting the
                      candidate. Present only in Preflighting.
                    type: string
                  preflightSnapshot:
                    description: |-
                      The CSI VolumeSnapshot the clone derives from. GC'd on pre-flight
                      completion.
                    type: string
                  stableSince:
                    description: |-
                      RFC3339 — when the rolling candidate was FIRST observed healthy in
                      production. The soak window (`upgradePolicy.soakSeconds`) must elapse from
                      this instant of continuous health before the upgrade is judged Succeeded
                      and `lastGoodImage` advances. Reset to empty whenever the candidate is
                      observed unhealthy, so a flapping candidate never commits. Present only in
                      Rolling, after the first healthy observation.
                    type: string
                  startedAt:
                    description: RFC3339 — when this upgrade attempt began.
                    type: string
                  targetImage:
                    description: The image this upgrade is driving toward (`spec.image` when it began).
                    type: string
                required:
                - targetImage
                type: object
              upgradeHistory:
                description: Bounded history (most-recent-last) of concluded upgrade attempts.
                items:
                  description: One completed upgrade attempt, appended to `status.upgradeHistory`.
                  properties:
                    at:
                      description: RFC3339 — when the attempt concluded.
                      type: string
                    fromImage:
                      description: The image production ran before the attempt.
                      type: string
                    image:
                      description: The candidate image the attempt targeted.
                      type: string
                    message:
                      type: string
                    result:
                      description: '`Succeeded` | `RolledBack` | `PreflightFailed` | `Superseded`.'
                      type: string
                  required:
                  - image
                  - result
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Queue
        type: object
    served: true
    storage: true
    subresources:
      status: {}
