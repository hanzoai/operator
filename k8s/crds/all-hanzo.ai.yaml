                      iamEndpoint:
                        type: string
                      sessionDuration:
                        type: string
                    type: object
                type: object
              initContainers:
                items:
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      items:
                        type: string
                      type: array
                    env:
                      items:
                        properties:
                          name:
                            type: string
                          value:
                            nullable: true
                            type: string
                          valueFrom:
                            nullable: true
                            properties:
