                      type: string
                    name:
                      type: string
                    readOnly:
                      nullable: true
                      type: boolean
                    subPath:
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              volumes:
                items:
                  description: |-
                    A pod volume: a name plus exactly one typed source. Each source is a real
