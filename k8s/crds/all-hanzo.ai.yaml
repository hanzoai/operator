                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  optional:
                                    nullable: true
                                    type: boolean
                                required:
                                - key
                                - name
                                type: object
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    envFrom:
                      items:
                        properties:
                          configMapRef:
                            nullable: true
                            properties:
