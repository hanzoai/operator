                default: 0
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Creating
                - Running
                - Degraded
                - Deleting
                - null
                nullable: true
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
              upgrade:
                description: |-
                  The in-flight upgrade FSM state (absent ⇒ Stable). Fully derived from the
                  spec + cluster each reconcile, so the FSM resumes across operator restart.
