name: sync
# THE LAW: .github/workflows holds no CI. Everything that gates, builds or
# deploys lives in .hanzo/workflows and runs on our own runners.
#
# This file used to import hanzoai/.github/.github/workflows/docker-build.yml, a
# deprecated reusable, and had been failing to start on every push since — the
# operator image was never rebuilt, so merged fixes never reached the cluster
# while main reported nothing wrong. Kept as an empty marker rather than deleted
# so the next person finds this note instead of re-adding a GitHub build lane.
on:
  workflow_dispatch:
jobs:
  noop:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
