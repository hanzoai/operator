name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/operator
      # amd64-only: the arm64 ARC scale-set is offline (no runner matches
      # runner-arm64 ["self-hosted","linux","arm64"] → the arm64 job hangs
      # queued and the multi-arch manifest never publishes). DOKS
      # (do-sfo3-hanzo-k8s) is amd64, so amd64 is what prod runs. Restore
      # linux/amd64,linux/arm64 when the arm64 runner is back OR the native
      # build plane (platform BuildKit / git.hanzo.ai Actions) takes over.
      platforms: linux/amd64
    secrets: inherit
