name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/operator
      # arm64 enabled per user request. If hanzo-build-linux-arm64 ARC
      # scale set is paused on DOKS (per LLM.md 2026-04-27), the shared
      # workflow falls back to QEMU emulation on the amd64 runner.
      platforms: linux/amd64,linux/arm64
    secrets: inherit
